<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Font to PNG</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --text:#1d1d1f; --muted:#6b6b70; --line:#d9d7d1; --accent:#2f5bea; --accent-text:#ffffff;
  --check1:#e9e8e4; --check2:#f6f5f2;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --surface:#1f2024; --text:#ececee; --muted:#9a9aa2; --line:#33343a; --accent:#7c9cff; --accent-text:#101216;
    --check1:#2a2b30; --check2:#222328; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --surface:#1f2024; --text:#ececee; --muted:#9a9aa2; --line:#33343a; --accent:#7c9cff; --accent-text:#101216;
  --check1:#2a2b30; --check2:#222328; color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:.95rem;margin:0}
.sub{color:var(--muted);margin:0 0 24px}
.layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:16px}
.group{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.group.off .opts{display:none}
label,.lbl{display:block;font-size:.875rem;font-weight:600;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted)}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:44px;height:36px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.split{justify-content:space-between}
.opts{display:grid;gap:14px}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.875rem}
.check label{margin:0}
.up{font-size:.875rem;color:var(--muted)}
.up input{font:inherit;max-width:100%}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 16px;background:var(--accent);color:var(--accent-text);cursor:pointer}
details#symbols summary{cursor:pointer;font-size:.875rem;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
details#symbols[open] summary{margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.grid button{padding:0;height:42px;font:400 26px/1 "DoorsRevamped",sans-serif;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.grid button:hover{border-color:var(--accent)}
button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns button{flex:1}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{border:1px solid var(--line);border-radius:10px;padding:16px;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:auto;
  background-image:linear-gradient(45deg,var(--check1) 25%,transparent 25%,transparent 75%,var(--check1) 75%),linear-gradient(45deg,var(--check1) 25%,var(--check2) 25%,var(--check2) 75%,var(--check1) 75%);
  background-size:20px 20px;background-position:0 0,10px 10px}
.stage.dark{--check1:#2a2b30;--check2:#222328}
.stage.light{--check1:#e9e8e4;--check2:#f6f5f2}
.stage canvas{max-width:100%;height:auto;display:block}
.meta{color:var(--muted);font-size:.875rem;margin:10px 0 0}
.err{color:#c0392b;font-size:.875rem;margin:0}
.err:empty{display:none}
</style>
</head>
<body>
<main>
  <h1>Font to PNG</h1>
  <p class="sub">Type your text, pick a color, add the 3D perspective if you want, and download it as an image.</p>

  <div class="layout">
    <section class="panel" aria-label="Controls">
      <div>
        <label for="font">Font</label>
        <select id="font">
          <option value="doors">DOORS (Revamped)</option>
          <option value="custom">Upload my own font…</option>
        </select>
        <div class="up" id="upWrap" hidden style="margin-top:8px">
          <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2,font/*">
          <p class="err" id="err" role="alert"></p>
        </div>
      </div>

      <div>
        <label for="text">Text</label>
        <textarea id="text">HOTEL</textarea>
      </div>

      <details id="symbols">
        <summary>Symbols in this font <span class="hint">(tap one to add it)</span></summary>
        <div class="grid" id="grid"></div>
      </details>

      <div>
        <label for="size">Font size <span class="hint" id="sizeVal"></span></label>
        <input type="range" id="size" min="16" max="600" value="160">
      </div>

      <div class="row split">
        <div><label for="color">Text color</label><input type="color" id="color" value="#ffffff"></div>
        <div><label for="bg">Background</label><input type="color" id="bg" value="#14100e"></div>
        <div class="check"><input type="checkbox" id="transparent" checked><label for="transparent">Transparent</label></div>
      </div>

      <div>
        <label for="align">Alignment</label>
        <select id="align">
          <option value="left">Left</option>
          <option value="center" selected>Center</option>
          <option value="right">Right</option>
        </select>
      </div>

      <div class="group" id="g3d">
        <div class="check"><input type="checkbox" id="on3d" checked><label for="on3d"><h2>3D perspective</h2></label></div>
        <div class="opts">
          <div><label for="flare">Flare <span class="hint">(+ wider at bottom)</span> <span class="hint" id="flareVal"></span></label><input type="range" id="flare" min="-50" max="50" value="14"></div>
          <div><label for="tilt">Side tilt <span class="hint">(+ taller on the left)</span> <span class="hint" id="tiltVal"></span></label><input type="range" id="tilt" min="-40" max="40" value="0"></div>
          <div><label for="stretch">Height <span class="hint" id="stretchVal"></span></label><input type="range" id="stretch" min="50" max="200" value="130"></div>
        </div>
      </div>

      <div class="group">
        <div><label for="pad">Padding <span class="hint" id="padVal"></span></label><input type="range" id="pad" min="0" max="300" value="40"></div>
        <div>
          <label for="scale">Export resolution</label>
          <select id="scale">
            <option value="1">1× (as shown)</option>
            <option value="2" selected>2×</option>
            <option value="3">3×</option>
            <option value="4">4×</option>
          </select>
        </div>
        <div class="btns"><button id="download">Download PNG</button><button id="reset" class="secondary" type="button">Reset to defaults</button></div>
      </div>
    </section>

    <section aria-label="Preview">
      <div class="stage" id="stage"><canvas id="canvas" aria-label="Text preview"></canvas></div>
      <p class="meta" id="meta"></p>
    </section>
  </div>
</main>

  function b64ToBuf(b){ var s = atob(b), u = new Uint8Array(s.length); for (var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }
  function hex(h){ return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]; }

  function fontFamily(){ return ($('font').value === 'custom' && customLoaded ? '"UserFont"' : '"DoorsRevamped"') + ', sans-serif'; }

  function flat(scale){
    var size = +$('size').value * scale;
    var lines = $('text').value.split('\n');
    ctx.font = size + 'px ' + fontFamily();
    var widest = 1, fa = size * .8, fd = size * .2;
    lines.forEach(function(l){
      var m = ctx.measureText(l || ' ');
      widest = Math.max(widest, m.width);
      if (m.fontBoundingBoxAscent) { fa = m.fontBoundingBoxAscent; fd = m.fontBoundingBoxDescent; }
    });
    var lh = (fa + fd) * 1.05, mg = Math.ceil(size * .06);
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.min(Math.ceil(widest + mg*2), MAX_DIM));
    c.height = Math.max(1, Math.min(Math.ceil(lh*lines.length + mg*2), MAX_DIM));
    var g = c.getContext('2d');
    g.font = size + 'px ' + fontFamily();
    g.fillStyle = $('color').value; g.textBaseline = 'alphabetic';
    var align = $('align').value; g.textAlign = align;
    var x = align === 'left' ? mg : align === 'right' ? mg + widest : mg + widest/2;
    lines.forEach(function(l,i){ g.fillText(l, x, mg + i*lh + (lh - (fa + fd))/2 + fa); });
    return c;
  }

  function sqToQuad(q){
    var x0=q[0],y0=q[1],x1=q[2],y1=q[3],x2=q[4],y2=q[5],x3=q[6],y3=q[7];
    var dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;

    if (Math.abs(dx3)<1e-9 && Math.abs(dy3)<1e-9){ a=x1-x0;b=x2-x1;c=x0;d=y1-y0;e=y2-y1;f=y0; }
    else {
      var den=dx1*dy2-dx2*dy1;
      g=(dx3*dy2-dx2*dy3)/den; h=(dx1*dy3-dx3*dy1)/den;
      a=x1-x0+g*x1; b=x3-x0+h*x3; c=x0; d=y1-y0+g*y1; e=y3-y0+h*y3; f=y0;

  function warp(src, q, W, H){

        var u=(I[0]*X+I[1]*Y+I[2])/w, v=(I[3]*X+I[4]*Y+I[5])/w;

  function draw(scale){
    var L = flat(scale), on = $('on3d').checked;

    }
    canvas.width = Math.min(Math.ceil(W + pad*2), MAX_DIM);
    canvas.height = Math.min(Math.ceil(H + pad*2), MAX_DIM);
